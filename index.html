<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>İçerik Yönetim Paneli</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="page-header">
      <h1>İçerik Yönetim Paneli</h1>
      <p>Haberleri görüntüle ve yayın durumlarını takip et.</p>
    </header>

    <main>
      <section class="controls" aria-label="Haber arama araçları">
        <label for="search-input">Başlığa göre haber ara</label>
        <input
          id="search-input"
          type="search"
          placeholder="Örneğin: yapay zekâ"
        />

        <label for="category-filter">Kategori</label>
        <select id="category-filter">
          <option value="Tümü">Tüm kategoriler</option>
          <option value="Teknoloji">Teknoloji</option>
          <option value="Eğitim">Eğitim</option>
          <option value="Medya">Medya</option>
        </select>

        <label for="sort-order">Tarihe göre sırala</label>
        <select id="sort-order">
          <option value="newest">Yeniden eskiye</option>
          <option value="oldest">Eskiden yeniye</option>
        </select>
      </section>

      <section class="news-list" aria-label="Haber listesi"></section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
